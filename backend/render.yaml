services:
  - type: web
    name: frappedollars-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    autoDeploy: true
    region: oregon
    plan: free
    branch: main
    repo: <A REMPLACER PAR TON REPO GITHUB>
    healthCheckPath: /docs
    envVars:
      - key: SUPABASE_URL
        value: <A REMPLACER PAR TON SUPABASE_URL>
      - key: SUPABASE_KEY
        value: <A REMPLACER PAR TON SUPABASE_KEY>
